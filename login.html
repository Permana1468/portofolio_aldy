<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Muhamad Aldiansyah</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons for Input Fields & Social Media Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login-body">
  <div class="login-container" id="loginContainer">
    <div class="forms-container">
      <div class="signin-signup">
        <!-- SIGN IN FORM -->
        <form id="loginForm" class="login-form-card sign-in-form">
          <h2 class="login-title">Sign in</h2>
          <div class="input-field-pill">
            <i class="fas fa-user"></i>
            <input type="text" id="adminUser" placeholder="Username" required value="Aldyansyah">
          </div>
          <div class="input-field-pill">
            <i class="fas fa-lock"></i>
            <input type="password" id="adminPass" placeholder="Password" required value="admin123">
          </div>
          <button type="submit" id="loginBtn" class="btn-pill-solid">LOGIN</button>
          
          <p class="social-text">Or Sign in with social platforms</p>
          <div class="social-media">
            <a href="#" class="social-icon-circle" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon-circle" title="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon-circle" title="Google"><i class="fab fa-google"></i></a>
            <a href="#" class="social-icon-circle" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signupForm" class="login-form-card sign-up-form">
          <h2 class="login-title">Sign up</h2>
          <div class="input-field-pill">
            <i class="fas fa-user"></i>
            <input type="text" id="signupUser" placeholder="Username">
          </div>
          <div class="input-field-pill">
            <i class="fas fa-envelope"></i>
            <input type="email" id="signupEmail" placeholder="Email">
          </div>
          <div class="input-field-pill">
            <i class="fas fa-lock"></i>
            <input type="password" id="signupPass" placeholder="Password">
          </div>
          <button type="submit" class="btn-pill-solid">SIGN UP</button>

          <p class="social-text">Or Sign up with social platforms</p>
          <div class="social-media">
            <a href="#" class="social-icon-circle" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon-circle" title="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon-circle" title="Google"><i class="fab fa-google"></i></a>
            <a href="#" class="social-icon-circle" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </form>
      </div>
    </div>

    <!-- PANELS CONTAINER -->
    <div class="panels-container">
      <!-- LEFT PANEL (Shows in Sign In mode) -->
      <div class="panel left-panel">
        <div class="content">
          <h3>New here ?</h3>
          <p>Selamat datang! Buat akun baru atau beralih ke halaman registrasi administrator.</p>
          <button class="btn-pill-transparent" id="sign-up-btn">SIGN UP</button>
        </div>
        <!-- ROCKET & DEVELOPER SVG ILLUSTRATION -->
        <svg class="panel-illustration" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="250" cy="350" rx="180" ry="20" fill="#030b21" opacity="0.15" />
          <!-- Plants Background -->
          <path d="M70 320 Q50 240 85 160 Q100 240 70 320 Z" fill="#2979ff" opacity="0.6"/>
          <path d="M95 330 Q75 230 115 140 Q125 230 95 330 Z" fill="#2979ff" opacity="0.8"/>
          <path d="M380 340 Q410 260 430 180 Q415 260 380 340 Z" fill="#2979ff" opacity="0.7"/>

          <!-- Rocket -->
          <path d="M160 170 C160 80 200 20 200 20 C200 20 240 80 240 170 L240 280 H160 Z" fill="#ffffff"/>
          <path d="M200 20 C200 20 240 80 240 170 H200 Z" fill="#e2e8f0"/>
          <!-- Wings -->
          <path d="M160 210 C130 220 105 270 105 310 C135 300 160 280 160 280 Z" fill="#2979ff"/>
          <path d="M240 210 C270 220 295 270 295 310 C265 300 240 280 240 280 Z" fill="#1565c0"/>
          <!-- Window -->
          <circle cx="200" cy="115" r="22" fill="#1e293b"/>
          <circle cx="200" cy="115" r="16" fill="#00e5ff"/>
          <circle cx="194" cy="109" r="5" fill="#ffffff" opacity="0.9"/>

          <!-- Sitting Person with Mobile Phone -->
          <ellipse cx="320" cy="335" rx="50" ry="12" fill="#0f172a" opacity="0.3"/>
          <circle cx="320" cy="225" r="20" fill="#3b2b4c"/>
          <path d="M305 210 C300 225 330 240 335 215 C330 200 310 200 305 210 Z" fill="#1a202c"/>
          <path d="M295 245 L350 245 L365 305 L285 305 Z" fill="#4d5b7c"/>
          <path d="M275 300 Q245 335 315 340 Q365 335 345 300 Z" fill="#1e293b"/>
          <!-- Phone Device -->
          <rect x="255" y="260" width="22" height="14" rx="3" fill="#00e5ff" transform="rotate(-15 255 260)"/>
        </svg>
      </div>

      <!-- RIGHT PANEL (Shows in Sign Up mode) -->
      <div class="panel right-panel">
        <div class="content">
          <h3>One of us ?</h3>
          <p>Sudah memiliki akun? Masuk ke akun Anda dan kelola portofolio sekarang.</p>
          <button class="btn-pill-transparent" id="sign-in-btn">SIGN IN</button>
        </div>
        <!-- DESK & TABLET WORKSTATION SVG ILLUSTRATION -->
        <svg class="panel-illustration" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="250" cy="350" rx="180" ry="20" fill="#030b21" opacity="0.15" />
          <!-- Desk Surface & Legs -->
          <rect x="70" y="250" width="360" height="16" fill="#334155" rx="3"/>
          <rect x="100" y="266" width="18" height="90" fill="#334155"/>
          <rect x="380" y="266" width="18" height="90" fill="#334155"/>

          <!-- Plant Pot -->
          <path d="M120 250 L136 250 L133 215 L123 215 Z" fill="#64748b"/>
          <path d="M128 215 Q115 180 130 150 Q142 180 128 215 Z" fill="#00e676"/>

          <!-- Monitor/Tablet -->
          <rect x="175" y="155" width="170" height="105" rx="8" fill="#1e293b"/>
          <rect x="183" y="163" width="154" height="89" rx="4" fill="#ffffff"/>
          <!-- Play Video Circle -->
          <circle cx="260" cy="207" r="24" fill="#2979ff"/>
          <polygon points="253,194 274,207 253,220" fill="#ffffff"/>

          <!-- Person Working on Chair -->
          <ellipse cx="380" cy="345" rx="35" ry="10" fill="#0f172a" opacity="0.3"/>
          <rect x="376" y="280" width="8" height="65" fill="#334155"/>
          <path d="M350 260 C350 230 410 230 410 260 L400 300 L360 300 Z" fill="#1e293b"/>

          <circle cx="385" cy="185" r="18" fill="#2b2d42"/>
          <path d="M360 205 L405 205 L420 275 L365 275 Z" fill="#2979ff"/>
          <path d="M370 275 L385 330 L400 330 L410 275 Z" fill="#0f172a"/>
        </svg>
      </div>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
